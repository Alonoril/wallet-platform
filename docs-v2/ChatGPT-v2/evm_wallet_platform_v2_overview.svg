<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="2130px" version="1.1" viewBox="0 0 2400 2130" width="2400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-main" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12" refY="6"><path d="M 1 1 L 12 6 L 1 11 z" fill="#597393" /></marker><marker id="arr-green" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12" refY="6"><path d="M 1 1 L 12 6 L 1 11 z" fill="#28986d" /></marker><marker id="arr-orange" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12" refY="6"><path d="M 1 1 L 12 6 L 1 11 z" fill="#c58a26" /></marker><marker id="arr-red" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12" refY="6"><path d="M 1 1 L 12 6 L 1 11 z" fill="#c65c5c" /></marker></defs><rect fill="#f6f8fc" height="2130" width="2400" x="0" y="0" /><rect fill="#496eca" height="16" width="2400" x="0" y="0" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="52" font-weight="bold" x="80" y="93">EVM Wallet Platform · 充值合约业务流程 V2</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="24" x="82" y="148">用户未归集资产可直接提现   /   自动归集进入按币种限额的热钱包池   /   风险地址独立轮换</text><rect fill="#6d8dd8" height="40" rx="4" width="8" x="80" y="195" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="105" y="224">01  创建用户专属充值合约</text><rect fill="#edf4ff" height="156" rx="22" ry="22" stroke="#477fd5" stroke-width="3" width="500" x="80" y="260" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="330.0" y="319">租户用户</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="330.0" y="365">申请 / 查询充值地址</text><rect fill="#edf4ff" height="156" rx="22" ry="22" stroke="#477fd5" stroke-width="3" width="500" x="660" y="260" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="910.0" y="319">Wallet API + Factory</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="910.0" y="365">按租户、用户、链、版本管理</text><rect fill="#f1edff" height="156" rx="22" ry="22" stroke="#8068c7" stroke-width="3" width="500" x="1240" y="260" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1490.0" y="319">DepositVault · ACTIVE</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1490.0" y="365">独立合约地址，非助记词派生</text><rect fill="#edf4ff" height="156" rx="22" ry="22" stroke="#477fd5" stroke-width="3" width="500" x="1820" y="260" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="2070.0" y="319">链上充值 + Indexer</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="2070.0" y="365">原生币 / ERC20 入账记录</text><polyline fill="none" marker-end="url(#arr-main)" points="580,338 660,338" stroke="#597393" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-main)" points="1160,338 1240,338" stroke="#597393" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-main)" points="1740,338 1820,338" stroke="#597393" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#6d8dd8" height="40" rx="4" width="8" x="80" y="457" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="105" y="486">02  合约持有未归集资产（三种后续路径）</text><rect fill="#e8edf6" height="150" rx="22" ry="22" stroke="#5c7397" stroke-width="3" width="750" x="825" y="516" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="34" font-weight="bold" text-anchor="middle" x="1200.0" y="575">未归集资产 · DepositVault</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" text-anchor="middle" x="1200.0" y="621">充值资产留在用户合约内；支持观察期内直接提现</text><polyline fill="none" marker-end="url(#arr-main)" points="2070,416 2070,468 1200,468 1200,516" stroke="#597393" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-green)" points="1200,666 1200,717 425,717 425,819" stroke="#28986d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-orange)" points="1200,666 1200,819" stroke="#c58a26" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-red)" points="1200,666 1200,717 1975,717 1975,819" stroke="#c65c5c" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#ffffff" height="56" rx="14" stroke="#e0e7f0" width="700" x="80" y="752" /><text fill="#28986d" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" text-anchor="middle" x="430" y="790">A｜用户直接提现 · 不经过热钱包池</text><rect fill="#ffffff" height="56" rx="14" stroke="#e0e7f0" width="700" x="850" y="752" /><text fill="#c58a26" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" text-anchor="middle" x="1200" y="790">B｜通过观察期后自动归集</text><rect fill="#ffffff" height="56" rx="14" stroke="#e0e7f0" width="700" x="1620" y="752" /><text fill="#c65c5c" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" text-anchor="middle" x="1970" y="790">C｜异常 / 污染地址处置</text><rect fill="#e9f8ef" height="166" rx="22" ry="22" stroke="#28986d" stroke-width="3" width="700" x="80" y="830" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="430.0" y="889">用户提交提现请求</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="430.0" y="935">只针对 ACTIVE 合约未归集余额</text><rect fill="#e9f8ef" height="166" rx="22" ry="22" stroke="#28986d" stroke-width="3" width="700" x="80" y="1048" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="430.0" y="1107">平台身份认证 / 单签授权</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="430.0" y="1153">可采用服务端签名 + nonce 防重放</text><rect fill="#e9f8ef" height="166" rx="22" ry="22" stroke="#28986d" stroke-width="3" width="700" x="80" y="1266" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="430.0" y="1325">Relayer 发链上交易</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="430.0" y="1371">Gas 由独立 Relayer 支付，不用热钱包</text><rect fill="#e9f8ef" height="166" rx="22" ry="22" stroke="#28986d" stroke-width="3" width="700" x="80" y="1484" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="430.0" y="1543">DepositVault.withdraw()</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="430.0" y="1589">直接从用户充值合约转出</text><rect fill="#e9f8ef" height="166" rx="22" ry="22" stroke="#28986d" stroke-width="3" width="700" x="80" y="1702" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="430.0" y="1761">用户指定的外部地址</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="430.0" y="1807">不需要多签 / 不通过 HotVault</text><polyline fill="none" marker-end="url(#arr-green)" points="430,996 430,1048" stroke="#28986d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-green)" points="430,1214 430,1266" stroke="#28986d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-green)" points="430,1432 430,1484" stroke="#28986d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-green)" points="430,1650 430,1702" stroke="#28986d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#fff7e8" height="166" rx="22" ry="22" stroke="#c58a26" stroke-width="3" width="700" x="850" y="830" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1200.0" y="889">观察期计时 + 归集前风控</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1200.0" y="935">仅限制平台自动归集，不限制主动提现</text><rect fill="#fff7e8" height="166" rx="22" ry="22" stroke="#c58a26" stroke-width="3" width="700" x="850" y="1048" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1200.0" y="1107">观察期结束且允许归集？</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1200.0" y="1153">是：执行资金池分配；否：暂不归集</text><rect fill="#fff7e8" height="166" rx="22" ry="22" stroke="#c58a26" stroke-width="3" width="700" x="850" y="1266" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1200.0" y="1325">HotPoolManager</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1200.0" y="1371">按照 chain + token 的独立上限选池</text><rect fill="#fff7e8" height="166" rx="22" ry="22" stroke="#c58a26" stroke-width="3" width="700" x="850" y="1484" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1200.0" y="1543">DepositVault.sweep()</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1200.0" y="1589">转账至有可用容量的 HotVault</text><rect fill="#fff7e8" height="166" rx="22" ry="22" stroke="#c58a26" stroke-width="3" width="700" x="850" y="1702" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1200.0" y="1761">HotVault 资金池</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1200.0" y="1807">最多 20 / 50 个；满额触发转冷轮换</text><polyline fill="none" marker-end="url(#arr-orange)" points="1200,996 1200,1048" stroke="#c58a26" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-orange)" points="1200,1214 1200,1266" stroke="#c58a26" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-orange)" points="1200,1432 1200,1484" stroke="#c58a26" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-orange)" points="1200,1650 1200,1702" stroke="#c58a26" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#fff0f0" height="166" rx="22" ry="22" stroke="#d36c6c" stroke-width="3" width="700" x="1620" y="830" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1970.0" y="889">来源异常 / 地址遭污染</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1970.0" y="935">标记风险；自动归集暂停</text><rect fill="#fff0f0" height="166" rx="22" ry="22" stroke="#d36c6c" stroke-width="3" width="700" x="1620" y="1048" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1970.0" y="1107">ACTIVE 状态下仍支持提现</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1970.0" y="1153">内部风险标签不直接改变提现权限</text><rect fill="#fff0f0" height="166" rx="22" ry="22" stroke="#d36c6c" stroke-width="3" width="700" x="1620" y="1266" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1970.0" y="1325">DepositFactory 创建新版本</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1970.0" y="1371">tenant + user + chain + version +1</text><rect fill="#fff0f0" height="166" rx="22" ry="22" stroke="#d36c6c" stroke-width="3" width="700" x="1620" y="1484" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1970.0" y="1543">旧合约进入 RETIRED</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1970.0" y="1589">禁止提现及归集，停止业务入账监听</text><rect fill="#fff0f0" height="166" rx="22" ry="22" stroke="#d36c6c" stroke-width="3" width="700" x="1620" y="1702" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1970.0" y="1761">旧地址后续误转不入账</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1970.0" y="1807">保留链上安全审计；不可阻止直接转币</text><polyline fill="none" marker-end="url(#arr-red)" points="1970,996 1970,1048" stroke="#c65c5c" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-red)" points="1970,1214 1970,1266" stroke="#c65c5c" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-red)" points="1970,1432 1970,1484" stroke="#c65c5c" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-red)" points="1970,1650 1970,1702" stroke="#c65c5c" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#edf1f8" height="120" rx="16" stroke="#ced9e9" stroke-width="2" width="2240" x="80" y="1927" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="25" font-weight="normal" text-anchor="start" x="120" y="1974">注意：代币发行方冻结 / 司法限制依旧有效；归集后发现高风险资金，应隔离受影响 HotVault 并审计资金去向。</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" text-anchor="start" x="120" y="2011">状态边界：ACTIVE 可执行授权提现；RETIRED 不支持提现。未归集提现和自动归集需用同一链上余额做原子校验。</text></svg>