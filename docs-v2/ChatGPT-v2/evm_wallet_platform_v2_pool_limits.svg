<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1580px" version="1.1" viewBox="0 0 2400 1580" width="2400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-main" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12" refY="6"><path d="M 1 1 L 12 6 L 1 11 z" fill="#597393" /></marker><marker id="arr-green" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12" refY="6"><path d="M 1 1 L 12 6 L 1 11 z" fill="#28986d" /></marker><marker id="arr-orange" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12" refY="6"><path d="M 1 1 L 12 6 L 1 11 z" fill="#c58a26" /></marker><marker id="arr-red" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12" refY="6"><path d="M 1 1 L 12 6 L 1 11 z" fill="#c65c5c" /></marker></defs><rect fill="#f6f8fc" height="1580" width="2400" x="0" y="0" /><rect fill="#496eca" height="16" width="2400" x="0" y="0" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="52" font-weight="bold" x="80" y="93">HotPoolManager · 按币种限额与钱包池轮换 V2</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="24" x="82" y="148">币种上限配置 API → 链上配置生效 → 精确额度检查 → HotVault 选择 / 创建 / 转冷</text><rect fill="#6d8dd8" height="40" rx="4" width="8" x="80" y="212" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="105" y="241">01  按链、币种配置额度（管理 API）</text><rect fill="#edf4ff" height="171" rx="22" ry="22" stroke="#477fd5" stroke-width="3" width="470" x="80" y="277" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="315.0" y="336">管理后台 API</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" text-anchor="middle" x="315.0" y="382">PUT /chains/{id}/hot-pool/limits</text><rect fill="#edf4ff" height="171" rx="22" ry="22" stroke="#477fd5" stroke-width="3" width="470" x="670" y="277" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="905.0" y="336">管理权限 + 审计</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" text-anchor="middle" x="905.0" y="382">RBAC、审批与配置版本</text><rect fill="#f1edff" height="171" rx="22" ry="22" stroke="#8068c7" stroke-width="3" width="470" x="1260" y="277" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="1495.0" y="336">链上额度配置交易</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" text-anchor="middle" x="1495.0" y="382">更新 tokenAddress → maxBalance</text><rect fill="#e9f8ef" height="171" rx="22" ry="22" stroke="#28986d" stroke-width="3" width="470" x="1850" y="277" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="2085.0" y="336">事件确认 + 配置生效</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" text-anchor="middle" x="2085.0" y="382">监听 TokenLimitUpdated</text><polyline fill="none" marker-end="url(#arr-main)" points="550,361 670,361" stroke="#597393" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-main)" points="1140,361 1260,361" stroke="#597393" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-main)" points="1730,361 1850,361" stroke="#597393" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#ffffff" height="91" rx="14" stroke="#d8e1ef" stroke-width="2" width="2240" x="80" y="481" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="25" font-weight="normal" text-anchor="start" x="115" y="519">额度键：(chainId, tokenAddress)，原生币使用专用标识；额度值建议使用最小单位整数，避免浮点误差。</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" text-anchor="start" x="115" y="553">可选额外控制：每币种 USD 限额 / 单笔归集限额 / 总池 USD 上限；与链上持仓限制分开建模。</text><rect fill="#6d8dd8" height="40" rx="4" width="8" x="80" y="612" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="105" y="641">02  自动归集路由（逐币种独立判定）</text><rect fill="#edf4ff" height="154" rx="22" ry="22" stroke="#477fd5" stroke-width="3" width="480" x="80" y="680" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="31" font-weight="bold" text-anchor="middle" x="320.0" y="739">待归集资金</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" text-anchor="middle" x="320.0" y="785">token + amount + sourceVault</text><rect fill="#f1edff" height="154" rx="22" ry="22" stroke="#8068c7" stroke-width="3" width="480" x="675" y="680" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="31" font-weight="bold" text-anchor="middle" x="915.0" y="739">读取该币种上限</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" text-anchor="middle" x="915.0" y="785">maxBalance  + 当前链上余额</text><rect fill="#fff7e8" height="154" rx="22" ry="22" stroke="#c58a26" stroke-width="3" width="480" x="1270" y="680" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1510.0" y="739">现有 HotVault 可容纳？</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1510.0" y="785">余额 + 本次金额 ≤ 币种上限</text><rect fill="#e9f8ef" height="154" rx="22" ry="22" stroke="#28986d" stroke-width="3" width="445" x="1875" y="680" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="2097.5" y="739">归集至已有 HotVault</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="2097.5" y="785">同币种额度原子校验</text><polyline fill="none" marker-end="url(#arr-main)" points="560,757 675,757" stroke="#597393" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-main)" points="1155,757 1270,757" stroke="#597393" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-green)" points="1750,757 1875,757" stroke="#28986d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#23835e" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1810" y="734">是</text><polyline fill="none" marker-end="url(#arr-orange)" points="1510,834 1510,906" stroke="#c58a26" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#a57d29" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="start" x="1552" y="879">否</text><rect fill="#fff7e8" height="154" rx="22" ry="22" stroke="#c58a26" stroke-width="3" width="480" x="1270" y="920" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="1510.0" y="979">HotVault 数量未达上限？</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1510.0" y="1025">poolMax = 20 或 50</text><polyline fill="none" marker-end="url(#arr-green)" points="1750,997 1875,997" stroke="#28986d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#e9f8ef" height="154" rx="22" ry="22" stroke="#28986d" stroke-width="3" width="445" x="1875" y="920" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="2097.5" y="979">创建新的 HotVault</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="2097.5" y="1025">绑定管理权限并执行归集</text><text fill="#23835e" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1810" y="966">是</text><polyline fill="none" marker-end="url(#arr-orange)" points="1510,1074 1510,1145" stroke="#c58a26" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#a57d29" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="start" x="1552" y="1116">否</text><rect fill="#fff7e8" height="162" rx="22" ry="22" stroke="#c58a26" stroke-width="3" width="480" x="1270" y="1158" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="1510.0" y="1217">选择最旧健康 HotVault</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1510.0" y="1263">只清理可转移、未隔离的资产</text><rect fill="#e9f8ef" height="162" rx="22" ry="22" stroke="#28986d" stroke-width="3" width="445" x="1875" y="1158" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="2097.5" y="1217">转入离线冷钱包</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="2097.5" y="1263">公开地址可见；私钥绝不入系统</text><polyline fill="none" marker-end="url(#arr-green)" points="1750,1238 1875,1238" stroke="#28986d" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arr-main)" points="2095,1320 2095,1368 915,1368 915,834" stroke="#597393" stroke-dasharray="10 9" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" text-anchor="middle" x="1460" y="1349">转冷释放容量后重新选择目标合约</text><rect fill="#fff7e9" height="92" rx="14" stroke="#f0cc8d" stroke-width="2" width="2240" x="80" y="1442" /><text fill="#15233e" font-family="Noto Sans CJK SC" font-size="25" font-weight="normal" text-anchor="start" x="113" y="1481">强一致性注意：改小上限不自动移除现有持仓；外部直接转币及价格波动也可能导致实际余额超额。</text><text fill="#51627d" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" text-anchor="start" x="113" y="1516">归集交易应在执行前重查实际余额；并发归集需序列化或设置容量预留，避免超配。</text></svg>