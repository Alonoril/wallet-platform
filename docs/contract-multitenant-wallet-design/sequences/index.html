const diagrams=[{"stem": "20261011-00-bootstrap", "title": "租户隔离、部署与激活", "principle": "每个租户、每条链拥有独立权限、风险状态和资金池；先形成不可变的绑定关系，再开放执行权限。", "checkpoints": ["初始化不能被抢占，所有固定绑定必须在对外开放前核对。", "登记合约类型、租户、资产路由和代码身份；登记动作不能替代代码审计。", "Factory 的新版本形成新地址域，旧地址继续由其原合约管理。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor C as Council<br/>离线治理多签\nactor D as Deployer<br/>部署事务发起者\nbox rgb(235,242,255) 租户治理\n  participant T as TenantTimelock<br/>延迟执行\n  participant A as TenantAuthority<br/>权限与签名版本\nend\nbox rgb(255,235,238) 风险控制\n  participant R as RiskRegistry<br/>案件与预留\nend\nbox rgb(232,250,241) 资金与路由\n  participant P as PoolRegistry<br/>池登记与限额\n  participant V as ContractSet<br/>Factory及各资金合约\nend\nrect rgb(235,242,255)\n  Note over C,V: 准备阶段：执行者和资金路由保持关闭<br/>链 / tenantKey / poolId 是整套协议的隔离边界\n  D->>D: 预计算固定互绑地址，核对租户部署清单\n  D->>T: 部署时间锁，绑定治理多签及最小延迟\n  D->>A: 部署租户权限，设置不可变租户标识\n  D->>R: 部署风险状态，绑定 Authority\n  D->>P: 部署路由和共享预算，绑定租户及 RiskRegistry\n  D->>V: 部署资金池、Manager、Factory、Controller\n  V->>V: 原子初始化固定地址互绑，锁定重复初始化\n  D->>P: 在受限初始化阶段登记池类型、地址及代码身份\n  P->>V: 读取并核对固定绑定与资金出口类型\n  V-->>P: 返回租户、治理、风险及池绑定\n  P->>P: 仅记录通过核对的池，路由仍未激活\n  D->>A: 封闭初始化权限；后续配置仅按治理角色执行\nend\nrect rgb(232,250,241)\n  C->>T: 排队激活参数，绑定 payloadHash 和执行时间\n  T->>T: 等待治理延迟，拒绝重复或提前执行\n  C->>T: execute(精确激活参数)\n  T->>A: 设置用途隔离的签名者、资产、Executor\n  T->>P: 配置观察期、限额、目标路由与安全底线\n  T->>P: 开放已核对路由，递增配置版本\n  A-->>C: 发出权限配置事件\n  P-->>C: 发出路由激活事件\n  Note over A,V: 资金合约每次执行仍检查当前权限和风险<br/>部署成功或登记成功不等于获得任意转账权限\nend\n"}, {"stem": "20261011-01-address", "title": "CREATE2 预测地址、预充值与原子部署", "principle": "充值地址是固定代码和固定地址域的计算结果，用户地址无需独立私钥；收款能力与主动移动资金的权限分开。", "checkpoints": ["CREATE2 地址由 Factory、salt、initCodeHash 共同决定；Clone 的 initCode 固定实现地址。", "salt 绑定链、租户、用户标识和地址版本，不复用跨租户或跨版本的地址域。", "未部署地址也能接收资产；部署不会清除已在 RiskRegistry 中登记的限制。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor U as 用户 / 外部转账者\nactor L as Relayer<br/>仅提交交易\nbox rgb(228,249,252) 充值地址体系\n  participant M as VaultManager<br/>授权部署入口\n  participant F as VaultFactory<br/>地址计算与部署\n  participant I as DepositImplementation<br/>固定逻辑实现\n  participant V as DepositVault<br/>用户合约地址\nend\nbox rgb(255,235,238) 独立风险状态\n  participant R as RiskRegistry<br/>可记录无代码地址\nend\nparticipant X as 资产余额<br/>Native / ERC20\nrect rgb(228,249,252)\n  L->>F: predict(chain, tenantKey, walletKey, addressVersion)\n  F->>F: 计算域隔离 salt 和固定 Clone initCodeHash\n  F-->>L: predictedAddress<br/>keccak256(0xff, Factory, salt, initCodeHash) 的后20字节\n  Note over F,I: ERC-1167 Clone 的 delegatecall 目标固定<br/>用户余额和存储位于 Clone，逻辑实现本身不托管充值\n  U->>X: 将 Native 或 ERC20 转入 predictedAddress\n  X-->>U: 资产层确认转账；此时 Vault 可以尚未部署\n  Note over V,X: 未部署地址无法自行发出合约充值事件<br/>原生币由交易/余额识别，ERC20 由代币事件识别\nend\nrect rgb(235,242,255)\n  L->>M: deploy(walletKey)\n  M->>M: 校验 Executor，禁止任意地址获得部署权限\n  M->>F: 请求部署已绑定用户地址\n  F->>F: 只允许 Manager / Controller；核对地址域和固定实现\n  alt 地址尚无代码\n    F->>V: CREATE2 部署固定实现 Clone\n    F->>V: 同一事务 initialize(租户、Manager、Controller、Risk)\n    V->>I: delegatecall 固定实现的初始化逻辑\n    I->>I: 在 Clone 上下文校验 Factory 来源和一次性初始化\n    I-->>V: 绑定写入 Clone 存储；返回初始化结果\n    V->>V: 永久锁定重复初始化\n    V-->>F: 返回初始化完成状态\n  else 地址已经部署\n    F->>V: 核对本 Factory 登记、固定绑定和初始化状态\n    V-->>F: 返回已登记 Vault\n  end\n  F-->>M: VaultDeployed / 已存在地址\n  M-->>L: 返回用户 Vault 地址\n  V->>R: 后续主动转账前读取当前限制\n  R-->>V: 返回该地址的 HOLD、pause、reserve 和 epoch\n  Note over I,V: delegatecall 保持原调用者，address(this) 和余额属于 Clone<br/>实现自身应锁定初始化，不替任何用户持有余额\n  Note over V,R: 风险按地址登记，部署前后的身份连续<br/>不能用部署、重部署或版本切换绕过冻结\nend\n"}, {"stem": "20261011-02-authorization", "title": "资金授权、防重放与原子执行", "principle": "执行者负责送交易，签名者批准具体业务，合约按当前链上状态作最终裁决；许可消费、预算和资金转移组成一个原子事务。", "checkpoints": ["EIP-712 Domain 绑定 chainId、校验合约和协议版本；业务结构体绑定租户、用途、资产、金额、目标、证据、有效期及版本。", "签名有效不等于请求可执行；当前 HOLD、暂停、路由、额度和请求状态仍必须满足。", "请求 ID 按合约及用途定义命名空间，业务订单在链外保持全局唯一；同一笔订单不能换 ID 重复授权。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor S as 业务签名者<br/>用途隔离的密钥\nactor L as Relayer<br/>Executor\nbox rgb(235,242,255) 通用执行约束\n  participant E as EntryContract<br/>资金入口合约\n  participant A as TenantAuthority<br/>角色与 signerEpoch\n  participant P as PoolRegistry<br/>路由与预算\nend\nbox rgb(255,235,238) 当前风险状态\n  participant R as RiskRegistry<br/>双端控制快照\nend\nparticipant X as 资产转移<br/>Native / ERC20\nS->>S: 构造精确业务 Permit，签署 EIP-712 digest\nS-->>L: Permit + 在线签名 + 必要的 Council 批准\nL->>E: execute(Permit, signatures)\nactivate E\nE->>A: 查询 Executor、用途签名者、资产及当前版本\nA-->>E: 返回当前权限与配置\nE->>E: 校验 Domain、用途、租户、金额、目标、证据和有效期\nE->>E: 验证 EOA 或 ERC1271 签名；按政策核验 Council\nE->>R: 查询源与目标全资产/单资产控制状态\nR-->>E: 返回 HOLD、pause、预留及当前 epoch\nE->>P: 查询当前路由、池类型和政策版本\nP-->>E: 返回固定路由与共享限额\nbreak 任一授权或状态检查不满足\n  E-->>L: revert；授权和资金均未消费\nend\nrect rgb(232,250,241)\n  E->>E: 拒绝重入；检查请求状态 Unused\n  E->>E: 请求状态写入 Executed，更新本次业务状态\n  E->>P: 消费适用的共享支付预算\n  P->>P: 只接受登记资金入口；记录预算，与执行同事务\n  E->>X: 按签名金额精确转账\n  X-->>E: 返回转账结果；核验源减量和目标增量\n  alt 任一步失败或余额变化不符\n    E-->>L: revert：请求、预算、业务状态和转账全部回滚\n  else 全部成功\n    E-->>L: 发出业务成功事件，携带 ID、金额、目标及证据摘要\n  end\nend\ndeactivate E\nNote over E,X: 所有普通出口共用当前风险和预留底线<br/>外部回调不能绕过执行锁，收费或变基代币不能冒充精确转账\n"}, {"stem": "20261011-03-sweep", "title": "单地址授权归集与风险二次检查", "principle": "Manager 负责验证逐笔授权并编排交易，DepositVault 只执行有限的固定出口；Clearing 的 lot 在收到真实资产后登记。", "checkpoints": ["采用全余额精确授权：amount = expectedBalance = 执行时余额；新入金导致旧授权失配，应重新评估并签署。", "Manager 和 Vault 都检查风险及目标绑定，不能只在链外风控或上游合约检查一次。", "归集和 lot 登记同事务提交，避免资金已移动却没有对应的清算额度。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor L as Relayer<br/>提交 SweepPermit\nbox rgb(228,249,252) 充值与归集\n  participant M as VaultManager<br/>授权编排\n  participant F as VaultFactory<br/>确定性部署\n  participant V as DepositVault<br/>有限资金出口\nend\nbox rgb(255,235,238) 风险与路由\n  participant R as RiskRegistry<br/>实时限制\n  participant P as PoolRegistry<br/>允许的归集目标\nend\nbox rgb(242,235,255) 接收资金\n  participant C as Clearing / Treasury<br/>同租户登记池\nend\nparticipant X as 资产余额<br/>Native / ERC20\nL->>M: sweep(Permit, riskSignature)\nM->>M: 核验 Executor、用途签名、租户、证据、金额和有效期\nM->>F: 查询 walletKey 对应的预测地址\nF-->>M: 返回唯一 DepositVault 地址\nM->>R: 检查 Vault 和目标的当前限制及 riskEpoch\nR-->>M: 无 HOLD / 安全暂停，版本匹配\nM->>P: 检查固定归集目标及 routeEpoch\nP-->>M: 同租户 Clearing 或 Treasury，路由开放\nM->>X: 查询 Vault 当前资产余额\nX-->>M: balance\nbreak 余额不等于授权 amount 和 expectedBalance\n  M-->>L: revert；重新评估新增入金后再签名\nend\nrect rgb(232,250,241)\n  M->>M: 原子消费归集 ID\n  M->>F: ensureDeployed(walletKey)\n  F->>V: 必要时同事务部署并初始化\n  F-->>M: 返回固定 Vault\n  M->>V: sweep(固定目标, token, 精确 amount)\n  V->>V: 只允许绑定的 Manager 调用\n  V->>P: 二次核对允许的归集目标\n  V->>R: 再查双端限制，核验源余额扣除后覆盖预留\n  V->>X: 精确移动资产至登记目标\n  X-->>C: 到账 amount\n  V-->>M: 归集完成，源减量与目标增量匹配\n  opt 目标是 Clearing\n    M->>C: recordLot(归集 ID, token, amount, 入池时间)\n    C->>C: 检查 Manager 来源和余额覆盖，生成 maturity\n    C-->>M: LotRecorded\n  end\n  M-->>L: SweepExecuted(ID, Vault, 目标, token, amount)\nend\nNote over M,X: 部署、转账或 lot 登记任一步失败，整个单笔归集回滚<br/>主动归集不替未知代币或第三方入金自动背书\n"}, {"stem": "20261011-04-batch", "title": "批量归集的单项隔离与交易边界", "principle": "批次是多份独立授权的容器，不能把多个地址合并成一份无限扫款授权；单项失败和外层失败采用不同恢复语义。", "checkpoints": ["执行前限制项目数量、calldata、签名长度和单项 gas，并检查重复 ID。", "子调用失败只撤销当前项；外层 OOG 或最终回滚仍撤销所有已成功项。", "只以逐项成功事件和请求状态判断执行结果；未执行项保留原 ID 并重新检查有效期和当前版本。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor L as Relayer<br/>批量交易发起者\nbox rgb(228,249,252) 批次与单项事务\n  participant M as VaultManager<br/>外层批次\n  participant I as ItemSubcall<br/>Manager的仅自调用入口\n  participant V as DepositVault<br/>第 i 个地址\nend\nparticipant R as RiskRegistry<br/>每项实时核验\nparticipant C as Clearing / Treasury<br/>接收池\nL->>M: batchSweep(逐项 Permit / signature / gasCap)\nM->>M: 预检数组边界、重复 ID、签名大小和单项 gas 上限\nM->>M: 建立外层执行锁，预留收尾事件的 gas\nloop 逐项执行，不能越过批次上限\n  alt 剩余 gas 足够执行当前项和收尾\n    M->>I: 有 gas 上限的 self-call executeItem(i)\n    activate I\n    Note over M,I: 内层入口只允许 Manager 自调用<br/>锁的设计必须允许这条受限内部路径，拒绝其他重入\n    I->>I: 独立验证当前项签名、版本、金额和请求状态\n    I->>R: 检查当前源与目标的风险状态\n    I->>V: 执行当前项部署 / 固定出口 / 精确转账\n    alt 当前项成功\n      V-->>I: 返回到账结果\n      I->>C: 必要时登记当前项 lot\n      I-->>M: success + 当前项成功事件\n    else 子调用 revert 或耗尽其 gas\n      I--xM: 子调用失败，当前项所有效果回滚\n      M->>M: 截断返回数据，记录有限长度错误摘要\n      M-->>L: ItemFailed(i, requestId, errorDigest)\n    end\n    deactivate I\n  else gas 不足\n    M-->>L: BatchStopped(firstUnexecuted)\n    Note over M,C: 停止循环，不执行后续项\n  end\nend\nalt 外层正常结束\n  M-->>L: 返回逐项结果；成功项可在同一交易中保留\nelse 外层 OOG 或最终 revert\n  M--xL: 整批回滚，包括先前成功项、lot 和事件\nend\nNote over L,C: 外层交易成功不代表每一项成功<br/>重试失败/未执行项，不重签已成功业务的新 ID\n"}, {"stem": "20261011-05-clearing", "title": "观察期 lot、部分结算与余额覆盖", "principle": "Clearing 将可结算权利记录为 lot，以余额覆盖 outstanding；观察期和逐 lot 释放共同约束普通资金出口。", "checkpoints": ["lot 由有效归集产生，记录资产、原始金额、已释放金额和 maturity；直接打入池的资产不自动生成 lot。", "普通结算只使用成熟且尚未释放的 lot，签名同时绑定 lot 列表和逐项金额。", "释放状态、outstanding 扣减和精确转账同事务变化，部分释放不会产生第二份权利。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor L as Relayer<br/>提交结算授权\nparticipant M as VaultManager<br/>归集编排\nbox rgb(242,235,255) 观察期资金池\n  participant C as ClearingVault<br/>lot 与 outstanding\nend\nparticipant R as RiskRegistry<br/>源与目标风控\nparticipant P as PoolRegistry<br/>结算路由\nbox rgb(232,250,241) 可支付资金池\n  participant T as TreasuryVault<br/>接收已结算资金\nend\nparticipant X as 资产余额<br/>Native / ERC20\nrect rgb(242,235,255)\n  M->>C: 资产已到账后 recordLot(ID, token, amount)\n  C->>X: 查询当前余额\n  X-->>C: balance\n  C->>C: 检查 lot 唯一，balance >= outstanding + amount\n  C->>C: 存储 amount / released=0 / maturity；增加 outstanding\n  C-->>M: LotRecorded\nend\nNote over C,T: 观察期未满时不得普通结算<br/>观察期降低不能追溯缩短已有 lot 的 maturity\nL->>C: settle(Permit, lotIds, amounts, settlementSignature)\nC->>C: 核验 Executor、签名、有效期和 lotsHash\nC->>C: 检查列表有界、无重复、同资产、成熟及剩余额度\nC->>R: 检查双端无 HOLD / pause，源扣除后仍覆盖预留\nR-->>C: 当前风险版本匹配，允许普通流出\nC->>P: 核验允许的 Treasury 目标和 routeEpoch\nP-->>C: 固定目标、同租户、开放路由\nbreak 未成熟 / 超额 / 重复 / 任一限制不满足\n  C-->>L: revert；lot 和资金均保持原状态\nend\nrect rgb(232,250,241)\n  C->>C: 消费结算 ID；released += 本次金额\n  C->>C: outstanding -= 本次总额\n  C->>X: 精确转账本次总额至 Treasury\n  X-->>T: 收到相同金额\n  C->>X: 核验转账差额及剩余余额覆盖 outstanding\n  C-->>L: SettlementExecuted + 逐 lot 释放事件\nend\nNote over C,X: lot 不是用户链上账户，也不表示物理区分同质化币<br/>任何失败必须连同 released / outstanding 一起回滚\n"}, {"stem": "20261011-06-lot-migration", "title": "Clearing 迁移与观察期继承", "principle": "迁移搬动保管位置和剩余 lot 权利，不制造已成熟状态；来源退休和目标导入必须一次提交。", "checkpoints": ["迁移由离线治理批准，并绑定源、目标、lot 明细、金额和当前风险快照。", "只迁移尚未释放的份额，目标 lot 继承原 maturity，并记录原池和原 lot 来源。", "目标导入入口只接受登记的同租户 Clearing，复核资产到账和迁移 ID。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor C as Council<br/>迁移独立批准\nactor L as Relayer<br/>提交迁移授权\nbox rgb(242,235,255) 原子迁移\n  participant S as SourceClearing<br/>退休剩余份额\n  participant D as TargetClearing<br/>继承观察期\nend\nparticipant P as PoolRegistry<br/>同类迁移路由\nparticipant R as RiskRegistry<br/>双端限制与预留\nparticipant X as 资产余额<br/>Native / ERC20\nC->>C: 审核目标绑定、来源 lot、maturity 和迁移金额\nC-->>L: 签署精确迁移内容及当前控制版本\nL->>S: migrateLots(迁移 Permit, 在线签名, Council 批准)\nS->>S: 核验授权、唯一迁移 ID 和有界 lot 列表\nS->>P: 检查同租户 Clearing → Clearing 路由\nP-->>S: 目标类型、代码身份和 routeEpoch 匹配\nS->>R: 检查双方限制，计算源剩余预留底线\nR-->>S: 当前控制状态满足迁移条件\nS->>S: 校验每个 lot 剩余份额；迁移不要求先成熟\nrect rgb(232,250,241)\n  S->>S: 消费迁移 ID；退休本次份额，减少 outstanding\n  S->>X: 精确转账总额至目标 Clearing\n  X-->>D: 资产到账\n  S->>D: importLots(迁移 ID, 源 lot, 份额, 原 maturity)\n  D->>P: 再查源登记身份、同类路由及当前版本\n  D->>R: 再查源和目标风险约束\n  D->>X: 确认到账余额覆盖新增 outstanding\n  D->>D: 生成含来源域的新 lot ID，拒绝重复迁移导入\n  D->>D: 导入剩余份额，继承每个原 maturity\n  D-->>S: LotsImported(来源映射)\n  S-->>L: MigrationExecuted(源 / 目标 / 总额)\nend\nNote over S,D: 目标拒绝导入则整笔迁移回滚，源份额恢复<br/>新 ID 不重新开始或缩短观察期，也不增加可支付权利\n"}, {"stem": "20261011-07-withdrawal", "title": "Treasury 提现、共享限额与取消竞争", "principle": "Treasury 是普通对外付款的唯一热池入口；链上按确切收款对象、预留底线和共享预算限制签名者的支付能力。", "checkpoints": ["外部提现、内部调拨使用不同授权用途；内部资产移动必须走登记路由。", "balance - amount 必须覆盖案件总预留与安全底线；无 HOLD 也不等于余额可以全部支付。", "取消和付款以链上顺序裁决，已执行不能撤销；暂停和版本变化也能阻断仍有效的旧签名。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor L as Relayer<br/>提交提现 Permit\nactor C as Guardian / Council<br/>取消及高额批准\nbox rgb(232,250,241) 普通对外支付\n  participant T as TreasuryVault<br/>请求状态与付款\n  participant P as PoolRegistry<br/>共享支付预算\nend\nparticipant A as TenantAuthority<br/>用途签名与政策\nparticipant R as RiskRegistry<br/>案件预留 / HOLD\nparticipant X as 资产转移<br/>Native / ERC20\nactor U as 外部收款人\nopt 政策要求高额独立共签\n  C-->>L: Council 批准同一份请求内容，绑定当前政策版本\nend\nalt 取消交易先被执行\n  C->>T: cancel(requestId)\n  T->>A: 校验取消角色\n  T->>T: Unused → Cancelled，发出取消事件\n  L->>T: executeWithdrawal(旧 Permit)\n  T--xL: 请求已取消，拒绝付款\nelse 付款交易先被执行\n  L->>T: executeWithdrawal(Permit, paymentSignature, approvals)\n  T->>A: 核验 Executor、付款签名者、资产和 policyEpoch\n  T->>T: 检查收款地址、金额、有效期、请求状态及必要共签\n  Note over T,U: 收款对象不得为受限名单或已知内部资金地址<br/>尚未部署的预测地址难以全部枚举，签名政策也须限制目的地\n  T->>R: 检查 Treasury 本资产与全资产 HOLD / pause / epoch\n  R-->>T: 返回 totalReserve 和当前开放状态\n  T->>X: 查询付款前真实余额\n  X-->>T: balance\n  T->>T: 检查 balance - amount >= totalReserve + safetyFloor\n  T->>P: 原子消费单笔 / 时间窗 / 租户共享支付限额\n  P-->>T: 额度通过并记录占用\n  T->>T: 消费 requestId，写入 Executed\n  T->>X: 精确转账指定金额至指定收款人\n  X-->>U: 到账 amount\n  T->>X: 核验双端余额变化\n  T-->>L: WithdrawalExecuted(requestId, token, amount, recipient)\n  C->>T: 稍后 cancel(同一 requestId)\n  T--xC: 已执行；没有逆转外部付款的入口\nend\nNote over T,U: 任一检查、预算消费或转账失败，本次事务整体回滚<br/>付款已确认后，追回外部资产需要链外处置或接收方配合\n"}, {"stem": "20261011-08-cold", "title": "热池转冷、离线批准回款与迁移预算", "principle": "ColdVault 降低在线可支配余额，只接受固定托管路由，回热池逐笔需要离线批准；同租户总敞口不会因切换池而重置。", "checkpoints": ["转冷和回款仍是资产移动，必须遵守当前风险、源预留底线和目标绑定。", "冷池不能直接向任意外部地址付款；回热后仍需独立的普通提现授权。", "共享限额由租户级 Registry 保存，新增 Treasury、迁移或改路由不能重置计数。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor L as Relayer<br/>送交易\nactor C as Council<br/>离线批准\nbox rgb(232,250,241) 热冷资金托管\n  participant T as TreasuryVault<br/>在线热池\n  participant D as ColdVault<br/>离线控制冷池\n  participant P as PoolRegistry<br/>固定路由及共享预算\nend\nparticipant R as RiskRegistry<br/>双端预留与限制\nparticipant X as 资产余额<br/>Native / ERC20\nrect rgb(232,250,241)\n  Note over L,X: 阶段一：减少热池敞口，转入固定冷池\n  L->>T: transferCustody(转冷 Permit, 用途签名, 必要共签)\n  T->>T: 核验调拨用途、当前版本、精确金额和唯一 ID\n  T->>P: 核验 Treasury → Cold 的同租户托管路由\n  T->>R: 检查双方开放，源剩余额度覆盖预留和热池底线\n  T->>P: 消费租户共享支付预算\n  T->>T: 消费调拨 ID\n  T->>X: 精确转账至固定 Cold\n  X-->>D: 托管资产到账\n  T-->>L: CustodyTransferred\nend\nrect rgb(235,242,255)\n  Note over L,X: 阶段二：补充热池流动性，另签独立回款授权\n  C->>C: 审核回款目标、金额、有效期、当前风险和政策\n  C-->>L: Council 对该笔回款签名，不授予无限权限\n  L->>D: returnToTreasury(回款 Permit, 用途签名, Council 批准)\n  D->>D: 核验两种批准、回款用途、请求 ID 和当前版本\n  D->>P: 检查 Cold → 登记 Treasury 的固定路由\n  D->>R: 双端必须开放，源扣除后仍覆盖案件预留\n  D->>P: 消费与全部 Treasury 共用的预算\n  D->>D: 消费回款 ID\n  D->>X: 精确转账至批准的 Treasury\n  X-->>T: 热池流动性到账\n  D-->>L: ColdReturned\nend\nNote over T,P: 同租户 Treasury → Treasury 迁移也使用登记路由<br/>迁移需独立批准，原共享预算和风险控制持续生效\nNote over T,X: 两个阶段是不同事务，不自动连续执行<br/>任一阶段失败只回滚该阶段；冷池无任意对外支付出口\n"}, {"stem": "20261011-09-risk-before", "title": "风险入金未归集：原地址冻结与旧授权撤销", "principle": "风险状态位于独立 Registry，可先于 Vault 部署生效；冻结提升版本，使冻结之前签发的归集许可失效。", "checkpoints": ["HOLD 按案件登记，scope 分全资产与单资产；解除一个案件不能解除其他案件。", "第三方转入、Vault 部署和请求取消都不能替代当前风险检查。", "原生币 token=0 的单资产 scope 与 allAssets scope 必须不同；冻结并不阻止继续收款。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor G as Guardian<br/>提交风险控制\nactor C as Council<br/>案件解除审批\nactor L as Relayer<br/>可能持有旧授权\nbox rgb(255,235,238) 可先于部署生效\n  participant R as RiskRegistry<br/>HOLD / epoch / caseId\nend\nparticipant M as VaultManager<br/>归集入口\nparticipant F as VaultFactory<br/>部署入口\nparticipant V as DepositVault<br/>尚未部署或已部署\nparticipant X as 资产余额<br/>第三方可继续转入\nrect rgb(255,235,238)\n  G->>R: addHold(caseId, predictedAddress, assetScope, evidenceHash)\n  R->>R: 核验 Guardian 和租户域；登记独立案件 HOLD\n  R->>R: 更新 HOLD 集合摘要、计数及 scopeEpoch\n  R-->>G: HoldAdded(caseId, address, scope, newEpoch)\n  L->>M: 提交冻结前签署的 SweepPermit\n  M->>R: 检查当前 HOLD 及 permit.riskEpoch\n  R-->>M: 存在 HOLD，且旧 epoch 已失配\n  M--xL: 拒绝归集，请求 ID 不消费\n  L->>M: 请求部署该 Vault\n  M->>M: 检查 Executor，不解除原地址风险限制\n  M->>F: 请求确定性部署\n  F->>V: 原子部署并初始化固定绑定\n  V->>R: 后续资金出口读取同一地址的风险状态\n  R-->>V: 原 HOLD 持续有效，部署不重置\n  X-->>V: 第三方仍可继续入金\nend\nrect rgb(235,242,255)\n  C->>R: releaseHold(仅指定 caseId, 最新证据 / 批准)\n  R->>R: 移除该案 HOLD，再次递增 scopeEpoch\n  alt 仍有其他 HOLD 或安全暂停\n    R-->>C: 当前 scope 继续限制普通资金流出\n  else 所有 HOLD 与安全暂停均已解除\n    R-->>C: 普通路径可重新评估，案件预留仍需单独处理\n  end\n  L->>M: 再次提交冻结前的旧归集签名\n  M->>R: 读取当前风险版本\n  R-->>M: 解除后的新 epoch 仍不等于旧签名 epoch\n  M--xL: 旧签名持续失效，须按当前余额重新签署\nend\nNote over R,V: 合约接受控制命令，不能自行判定哪笔入金是风险资金<br/>需要隔离时转入专项 Controller 流程，不能直接解冻后扫款\n"}, {"stem": "20261011-10-risk-after", "title": "风险入金已归集：逐池控制、多案件预留与缺口", "principle": "归集后必须控制实际持有资产的每个池；链上维护限制与可执行余额，来源证据和案件义务决定隔离金额。", "checkpoints": ["冻结原 Vault 不会自动冻结 Clearing、Treasury、Cold 或正在排队的许可。", "在受影响池按资产建立 HOLD 与案件预留，多案件预留求和；减少预留和解除 HOLD 是两个不同动作。", "已外付资产没有链上撤回能力；案件义务、可控金额与缺口分开记录，不能让别的租户补足。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor G as Guardian<br/>根据来源证据下控制命令\nactor C as Council<br/>案件预算与恢复批准\nbox rgb(255,235,238) 风险总账\n  participant R as RiskRegistry<br/>按池 / 资产 / 案件\nend\nbox rgb(232,250,241) 实际持有资金的池\n  participant S as ClearingVault<br/>观察期资金\n  participant T as TreasuryVault<br/>混合热池余额\n  participant D as ColdVault<br/>已转冷余额\nend\nactor L as Relayer<br/>可能提交旧授权\nparticipant X as 当前链上余额\nrect rgb(255,235,238)\n  Note over G,X: 风险发现时先定位当前持有池，再阻断普通出口<br/>控制交易只能约束其链上执行之后的交易，不能追回已先执行的付款\n  loop 对每个实际受影响的池及资产\n    G->>R: 原子 addHold + setMinimumReserve(caseId, pool, token, amount)\n    R->>R: 核验租户；同案幂等，不重复累计案件预留\n    R->>R: 建立 HOLD，更新该案绝对预留和 CAS version\n    R->>R: totalReserve = 各案件预留之和；递增控制 epoch\n    R-->>G: 发出案件、总预留和新控制版本事件\n  end\n  L->>T: 提交旧提现 / 转冷 / 迁移 Permit\n  T->>R: 检查本池当前 HOLD / pause / riskEpoch\n  R-->>T: 普通流出被阻断，旧授权版本失配\n  T--xL: 拒绝执行，ID 与付款额度不消费\n  L->>S: 提交旧结算授权\n  S->>R: 检查本池限制\n  R-->>S: 拒绝普通结算\n  L->>D: 提交旧回热授权\n  D->>R: 检查本池限制\n  R-->>D: 拒绝普通回款\nend\nrect rgb(255,246,221)\n  C->>X: 获取各池余额、在途执行结果与来源证据\n  X-->>C: 当前可控制余额，不包括已外部付款\n  C->>C: 分别确认案件义务、可控隔离量与未覆盖缺口\n  alt 需要专项隔离\n    C-->>L: 对当前双端快照及隔离金额签署 Controller 授权\n  else 可恢复部分普通业务\n    C->>R: 以 CAS 调整该案绝对预留，保留案件义务证据\n    C->>R: 独立解除该案 HOLD，其他案件保持有效\n    R-->>C: 递增控制版本；后续出口仍遵守 totalReserve\n  end\n  Note over R,X: 如果余额低于总预留，普通出口必须继续失败<br/>不能自动减少预留，也不能跨租户挪用余额填补缺口\nend\n"}, {"stem": "20261011-11-disposition", "title": "专项隔离：批准快照、预留迁移与 lot 退休", "principle": "DispositionController 为案件处置提供受限的例外资金路径，必须由离线批准精确内容；Quarantine 对转入的全部金额建立限制。", "checkpoints": ["批准绑定源与目标完整控制摘要、案件、金额、证据、预留版本、路由及有效期；状态变化撤销旧批准。", "HOLD 例外只允许批准的受限隔离路径，安全暂停始终阻断；其他案件预留不能被消耗。", "Clearing 中的登记 lot 随转出退休；无 lot 的直接入金只能使用 balance - outstanding。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor C as Council<br/>审核全部当前限制\nactor L as Relayer<br/>执行处置授权\nbox rgb(255,233,245) 受限隔离\n  participant D as DispositionController<br/>唯一例外编排\n  participant Q as QuarantineVault<br/>全额受限保管\nend\nparticipant R as RiskRegistry<br/>控制摘要与案件预留\nparticipant P as PoolRegistry<br/>专项处置路由\nparticipant F as VaultFactory<br/>必要时部署源地址\nparticipant S as SourceVault<br/>Deposit / Clearing / Treasury / Cold\nparticipant X as 资产余额<br/>Native / ERC20\nC->>R: 查询源 / 目标全资产及单资产控制摘要\nR-->>C: epochs、全部 HOLD 摘要、pause、总预留及 reserveVersion\nC->>C: 审核所有约束，批准 caseId / amount / reserveToMove / lotsHash\nC-->>L: Council 签署双端快照、目标 Quarantine、证据和有效期\nL->>D: isolate(Permit, CouncilSignature, lotDetails)\nD->>D: 验证 Executor、签名、金额、唯一 ID 和完整业务绑定\nD->>R: 核对当前双端 controlDigest 与源 reserveVersion\nR-->>D: 快照匹配；双方均无 SECURITY_PAUSED\nD->>P: 核验源身份和同租户 Quarantine 专项路由\nP-->>D: 允许受限隔离，不能改为任意外部收款人\nbreak 快照变化 / 安全暂停 / 签名或路由失配\n  D-->>L: revert，需重新审核并批准\nend\nrect rgb(255,233,245)\n  D->>D: 消费处置 ID，锁定本次编排\n  D->>R: 原子迁移该案预留，目标增加全部 amount 的预留和 HOLD\n  R->>R: 校验 reserveToMove <= amount 且不超过源该案预留\n  R->>R: 源只减少批准 reserveToMove；其他案件预留保留\n  R->>R: 目标按完整 amount 受限；双方控制版本递增\n  R-->>D: 返回更新后的源剩余预留底线\n  opt 来源为尚未部署的预测 DepositVault\n    D->>F: ensureDeployed(批准的 walletKey)\n    F->>S: CREATE2 部署并原子初始化固定绑定\n    F-->>D: 返回批准的源地址，原风险状态持续\n  end\n  alt 来源为 Clearing 且包含登记 lot\n    D->>S: prepareDisposition(lotIds, amounts, lotsHash)\n    S->>S: 核验来源权限、列表唯一和退休总额=amount\n    S->>S: 退休本次份额并减少 outstanding，允许未成熟份额\n  else 来源为 Clearing 的未登记直接入金\n    D->>S: 校验 lot 列表为空，amount <= balance - outstanding\n  else 来源为其他 Vault\n    D->>D: 要求 lot 参数为空，拒绝无意义的 lot 声明\n  end\n  D->>S: dispose(固定 Quarantine, token, amount, caseId)\n  S->>S: 仅允许 Controller；剩余余额覆盖其他案件和适用安全底线\n  S->>R: 再核验无安全暂停及更新后的剩余总预留\n  S->>X: 精确转账至已登记 Quarantine\n  X-->>Q: 接收 amount，全部资金已有目标限制\n  D-->>L: DispositionExecuted(案件、源、目标、金额、证据)\nend\nNote over D,X: 预留迁移、lot 退休、部署和转账必须同事务提交<br/>任何失败全部回滚；专项例外不能成为普通提现绕过口\n"}, {"stem": "20261011-12-release", "title": "Quarantine 解控、受控释放与后续独立支付", "principle": "隔离解除需要案件解除和资金释放两组明确动作；Quarantine 只有回指定 Treasury 的受控出口，没有普通外部支付权限。", "checkpoints": ["解除一个 HOLD 不会清除其他案件或安全暂停，也不会自动减记案件预留。", "释放签名在解除之后按最新快照签发，不能复用隔离授权或解除前签名。", "部分释放同步减记该案预留，剩余金额继续受限；回热池和外部提现不是同一笔业务。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor C as Council / Timelock<br/>按权限解除限制\nactor L as Relayer<br/>提交新释放授权\nbox rgb(255,233,245) 隔离与受控出口\n  participant D as DispositionController<br/>审核释放模式\n  participant Q as QuarantineVault<br/>无普通支付出口\nend\nparticipant R as RiskRegistry<br/>多案件限制及预留\nparticipant P as PoolRegistry<br/>Quarantine → Treasury\nparticipant T as TreasuryVault<br/>重新托管资金\nparticipant X as 资产余额<br/>Native / ERC20\nrect rgb(235,242,255)\n  C->>R: 对已结案的指定 caseId 解除 HOLD\n  R->>R: 清除此案件 HOLD，递增 epoch；不自动清除其他案件\n  opt 仍存在安全暂停\n    C->>R: 经时间锁批准后解除 SECURITY_PAUSED\n    R->>R: 递增控制版本\n  end\n  C->>R: 读取释放后的双端最新完整控制摘要\n  R-->>C: 当前 HOLD、pause、预留和版本\n  C-->>L: 签署独立 ReleasePermit，绑定精确金额和登记 Treasury\nend\nL->>D: release(新 Permit, CouncilSignature)\nD->>D: 检查模式只能为 Quarantine → Treasury，核验新 ID 和签名\nD->>R: 核验双端所有 HOLD / pause 均解除，快照匹配\nD->>P: 检查同租户受控释放路由与目标类型\nbreak 任一其他案件仍 HOLD / pause 或快照不匹配\n  D-->>L: 拒绝释放，即使该案自身已解除\nend\nrect rgb(232,250,241)\n  D->>D: 消费释放 ID\n  D->>R: 按批准 amount 减记源该案预留，核验 CAS version\n  R->>R: 要求 amount 不超过该案预留，拒绝减成负值\n  R->>R: 保留所有其他案件预留，目标本次不新增该案限制\n  R-->>D: 返回源剩余总预留\n  D->>Q: dispose(批准的 Treasury, token, amount)\n  Q->>R: 再查当前开放状态和剩余预留底线\n  Q->>X: 精确转账至 Treasury\n  X-->>T: 接收 amount\n  D-->>L: ReleaseExecuted(案件、金额、目标和证据)\nend\nNote over Q,T: 部分释放后，源剩余余额必须覆盖其剩余预留<br/>目标原有的其他案件预留不会因此消失\nL->>T: 若需外部支付，另提交独立 WithdrawalPermit\nT->>R: 再次检查当前风险与 Treasury 总预留\nT->>T: 独立核验付款签名、政策、限额和请求状态\nNote over T,X: 释放不是退款，外部支付需按提现序列单独执行<br/>转入或转出 Quarantine 不证明历史风险来源已经消失\n"}, {"stem": "20261011-13-governance", "title": "紧急收紧、延迟恢复与固定合约版本迁移", "principle": "紧急角色可以快速降低资金流出的能力；扩大权限、放宽政策和版本切换由离线治理及延迟执行约束。", "checkpoints": ["暂停路由不等于暂停所有外部付款；阻断提现必须控制资金池风险或执行者权限。", "HOLD 解除、预留减少和安全暂停解除按各自权限执行，不能笼统地称为一键恢复。", "固定代码采用新版本部署与显式资产迁移，地址、请求状态和风险限制保持可追溯。"], "source": "%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"Arial, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"18px\",\"primaryColor\":\"#edf2ff\",\"primaryTextColor\":\"#243b75\",\"primaryBorderColor\":\"#5c7cfa\",\"lineColor\":\"#345995\",\"actorBkg\":\"#edf2ff\",\"actorBorder\":\"#5c7cfa\",\"actorTextColor\":\"#243b75\",\"actorLineColor\":\"#94a3b8\",\"signalColor\":\"#345995\",\"signalTextColor\":\"#17345b\",\"labelBoxBkgColor\":\"#fff4d6\",\"labelBoxBorderColor\":\"#f59f00\",\"labelTextColor\":\"#8a4b08\",\"loopTextColor\":\"#8a4b08\",\"noteBkgColor\":\"#fff8db\",\"noteTextColor\":\"#724713\",\"noteBorderColor\":\"#e0b64f\",\"activationBkgColor\":\"#dbeafe\",\"activationBorderColor\":\"#4c6ef5\",\"sequenceNumberColor\":\"#ffffff\"},\"sequence\":{\"useMaxWidth\":false,\"wrap\":false,\"mirrorActors\":true,\"actorMargin\":65,\"width\":175,\"height\":70,\"boxMargin\":14,\"boxTextMargin\":12,\"messageMargin\":42,\"noteMargin\":14,\"diagramMarginX\":30,\"diagramMarginY\":25}}}%%\nsequenceDiagram\n    autonumber\nactor G as Guardian<br/>紧急收紧\nactor C as Council<br/>离线治理\nbox rgb(235,242,255) 延迟治理与版本\n  participant T as TenantTimelock<br/>排队与精确执行\n  participant A as TenantAuthority<br/>执行者及签名用途\n  participant P as PoolRegistry<br/>路由与共享限额\nend\nparticipant R as RiskRegistry<br/>安全暂停和案件状态\nparticipant V as Old / New Vault<br/>固定代码的不同版本\nrect rgb(255,235,238)\n  G->>A: 禁用 Executor 或特定用途签名者，提升对应版本\n  G->>P: 暂停资金路由，收紧共享限额\n  G->>R: 对受影响池 / 资产设置 SECURITY_PAUSED\n  R->>R: 提升控制 epoch，阻断所有相应资金出口\n  Note over A,V: 单独暂停内部路由不足以暂停外部提现<br/>使用池资产风险控制或 Executor 禁用覆盖付款入口\nend\nrect rgb(235,242,255)\n  C->>T: schedule(恢复参数 / payloadHash / 最早执行时间)\n  T->>T: 等待最小治理延迟，保留观察和取消窗口\n  alt 出现新证据，应撤销恢复\n    C->>T: cancel(该治理 operationId)\n    T->>T: 标记取消，拒绝以后执行该排队操作\n  else 未取消且延迟已到\n    C->>T: execute(精确排队参数)\n    T->>A: 恢复或轮换用途签名者 / Executor，提升版本\n    T->>P: 放宽限额或恢复批准的路由，提升配置版本\n    T->>R: 按批准解除安全暂停，提升控制 epoch\n  end\n  Note over R,V: 案件 HOLD 和案件预留仍需各自批准处理<br/>时间锁恢复不会自动抹除案件限制，也不复活旧签名\nend\nrect rgb(232,250,241)\n  C->>T: 排队登记已核验的新版本与迁移路由\n  T->>V: 核验已部署新版本的不可变绑定与权限配置\n  T->>P: 登记新池代码身份，开放批准的迁移路由\n  P->>P: 保留租户共享预算，不因新池出现而清零\n  C->>V: 另签精确资产迁移授权和最新控制快照\n  V->>R: 查双方风险；不能用换版本绕过 HOLD 或预留\n  V->>V: 执行符合池类型的迁移，Clearing 继承 lot maturity\n  Note over P,V: 旧充值地址仍属于旧 Factory 域并继续受原控制<br/>旧请求状态不清空，新版本业务 ID 仍需避免经济业务重复执行\nend\n"}];
const $=id=>document.getElementById(id);let current=0,scale=1,fitMode=true;
function applyScale(){const image=$('diagram');if(!image.naturalWidth)return;const available=$('viewport').clientWidth-36;if(fitMode)scale=Math.max(.25,Math.min(1,available/image.naturalWidth));image.style.width=Math.round(image.naturalWidth*scale)+'px';image.style.height='auto';$('zoom').value=Math.round(scale*100);$('percent').value=Math.round(scale*100)+'%';}
function navigation(){const query=$('search').value.trim().toLowerCase();$('nav').replaceChildren();diagrams.forEach((d,i)=>{if(!(d.title+d.principle+d.checkpoints.join(' ')+d.source).toLowerCase().includes(query))return;const link=document.createElement('a');link.href='#'+d.stem;link.textContent=String(i).padStart(2,'0')+' '+d.title;link.className=i===current?'active':'';$('nav').append(link);});}
function show(){const id=decodeURIComponent(location.hash.slice(1));const found=diagrams.findIndex(d=>d.stem===id);current=found<0?0:found;const d=diagrams[current];$('title').textContent=String(current).padStart(2,'0')+' · '+d.title;$('principle').textContent=d.principle;$('source').textContent=d.source;$('points').replaceChildren(...d.checkpoints.map(p=>{const li=document.createElement('li');li.textContent=p;return li;}));$('svg').href=d.stem+'.svg';$('mmd').href=d.stem+'.mmd';$('diagram').alt=d.title;$('diagram').src=d.stem+'.svg';$('viewport').scrollTop=0;$('viewport').scrollLeft=0;fitMode=true;navigation();}
function change(delta){location.hash=diagrams[(current+delta+diagrams.length)%diagrams.length].stem;}
function zoom(delta){fitMode=false;scale=Math.max(.25,Math.min(1.8,scale+delta));applyScale();}
$('diagram').addEventListener('load',applyScale);$('prev').onclick=()=>change(-1);$('next').onclick=()=>change(1);$('minus').onclick=()=>zoom(-.1);$('plus').onclick=()=>zoom(.1);$('zoom').oninput=e=>{fitMode=false;scale=Number(e.target.value)/100;applyScale();};$('fit').onclick=()=>{fitMode=true;applyScale();};$('read').onclick=()=>{fitMode=false;scale=1;applyScale();};$('search').oninput=navigation;window.addEventListener('hashchange',show);window.addEventListener('resize',()=>{if(fitMode)applyScale();});show();
</script></body></html>
